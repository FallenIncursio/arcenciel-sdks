version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/sdk-typescript
    schedule:
      interval: weekly
    groups:
      typescript-tooling:
        patterns:
          - '*'
  - package-ecosystem: pip
    directory: /packages/sdk-python
    schedule:
      interval: weekly
    groups:
      python-tooling:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
