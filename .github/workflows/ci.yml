name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and deterministic generation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: node scripts/verify-release.mjs
      - run: scripts/generate-developer-sdks.sh
      - run: git diff --exit-code -- packages/sdk-typescript packages/sdk-python
      - name: Reject private repository references
        run: '! rg --hidden --glob "!.git/**" "ProjectArc[E]nCiel|ArcEnCiel Private Licen[s]e" .'

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/sdk-typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx tsc && npx tsc -p tsconfig.esm.json && node scripts/write-esm-package.mjs
      - run: npm run pack:check

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: python -m build

  formatting:
    name: Maintained-file formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: >-
          npx --yes prettier@3.8.4 --check README.md CONTRIBUTING.md SECURITY.md RELEASING.md .prettierrc.json
          .github/dependabot.yml .github/workflows/*.yml scripts/*.mjs
